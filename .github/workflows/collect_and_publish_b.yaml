name: Collect and Publish (Model B)

on:
  schedule:
    - cron: "0 17,1 * * *"  # 17h e 01h UTC = 14h e 22h BRT (UTC-3)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Instalar dependências
        run: uv sync --locked

      - name: Executar pipeline (collect -> filter -> rewrite -> publish)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLASSIFIER_MODEL: ${{ secrets.GEMINI_CLASSIFIER_MODEL }}
          GEMINI_REWRITER_MODEL: ${{ secrets.GEMINI_REWRITER_MODEL_B }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_NOTICIAS_ID: ${{ secrets.WP_CATEGORY_NOTICIAS_ID }}
        run: uv run pilula publish

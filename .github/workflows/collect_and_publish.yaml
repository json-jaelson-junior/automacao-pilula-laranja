name: Collect and Publish

on:
  schedule:
    - cron: "0 10,14,18,22,1 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Instalar dependências
        run: uv sync --locked

      - name: Executar pipeline (collect -> filter -> rewrite -> publish)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLASSIFIER_MODEL: ${{ secrets.GEMINI_CLASSIFIER_MODEL }}
          GEMINI_REWRITER_MODEL: ${{ secrets.GEMINI_REWRITER_MODEL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_NOTICIAS_ID: ${{ secrets.WP_CATEGORY_NOTICIAS_ID }}
        run: uv run pilula publish
